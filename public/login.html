<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login – Jhonnywin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-box">
    <h2 style="color:#ffd700;text-align:center;">🔐 Login</h2>
    <form onsubmit="login(event)">
      <input type="text" id="username" placeholder="Username" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
      <div id="error" class="error"></div>
      <p style="text-align:center;margin-top:10px;">Don't have an account? <a href="/register.html" style="color:#ffd700;">Register</a></p>
    </form>
  </div>
  <script>
    async function login(e) {
      e.preventDefault();
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (data.error) document.getElementById('error').textContent = data.error;
      else window.location.href = '/';
    }
  </script>
</body>
</html>
